name: Argus Pages projections
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Argus Pages]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: argus-pages-projections
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      source_sha: ${{ steps.prepare.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m argus.github_host.projections prepare
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projection-input
          path: projection-input
          include-hidden-files: true
          retention-days: 1
  render:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: project
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: projection-input
          path: projection-input
      - run: python -m argus.github_host.projections render
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: projections
          path: projections.json
          retention-days: 1
  publish:
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: projections
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m argus.github_host.projections publish
