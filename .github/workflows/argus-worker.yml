name: Argus worker
run-name: 'Argus worker / ${{ inputs.task_id }} / ${{ inputs.attempt }}'
on:
  workflow_dispatch:
    inputs:
      task_id:
        type: string
        required: true
      attempt:
        type: string
        required: true
      state_commit:
        type: string
        required: true
      profile:
        type: string
        default: ubuntu
      state_branch:
        type: string
        default: argus-state
concurrency:
  group: argus-worker-${{ inputs.task_id }}-${{ inputs.attempt }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      runs_on: ${{ steps.prepare.outputs.runs_on }}
      execute: ${{ steps.prepare.outputs.execute }}
      timeout: ${{ steps.prepare.outputs.timeout }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - id: prepare
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
          TASK_ATTEMPT: ${{ inputs.attempt }}
          STATE_COMMIT: ${{ inputs.state_commit }}
          STATE_BRANCH: ${{ inputs.state_branch }}
        run: python -m argus.github_host prepare --branch "$STATE_BRANCH" --task-id "$TASK_ID" --attempt "$TASK_ATTEMPT" --state-commit "$STATE_COMMIT" --output host-input
      - if: steps.prepare.outputs.execute == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: argus-worker-input
          path: host-input
          include-hidden-files: true
          retention-days: 2
  execute:
    needs: prepare
    if: needs.prepare.outputs.execute == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.runs_on) }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.timeout) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          path: project
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
        with:
          model: 'true'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: argus-worker-input
          path: host-input
      - name: Execute the original Argus mission and review machinery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || vars.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          OPENAI_WIRE_API: ${{ vars.OPENAI_WIRE_API }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m argus.github_host execute --bundle host-input --runtime "$RUNNER_TEMP/native" --worktree project --output host-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: argus-result
          path: host-output/result.json
          retention-days: 14
  publish:
    needs: execute
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: argus-result
          path: host-output
      - name: Validate worker provenance and merge its proposal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATE_BRANCH: ${{ inputs.state_branch }}
        run: python -m argus.github_host publish-worker --branch "$STATE_BRANCH" --result host-output/result.json
