name: Argus validate
run-name: 'Argus validate / ${{ inputs.validation_key }}'
on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      candidate_sha:
        required: true
        type: string
      validation_key:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK_ID: ${{ inputs.task_id }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          VALIDATION_KEY: ${{ inputs.validation_key }}
        run: python -m argus.github_host.validation prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-manifest
          path: validation.json
          retention-days: 2
  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: validation-manifest
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Run configured candidate checks without model or publishing credentials
        run: python -m argus.github_host.validation execute
