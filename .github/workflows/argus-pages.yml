name: Argus Pages
on:
  workflow_dispatch:
  push:
    branches: [github-host]
    paths: [frontend/**, packages/**, .github/workflows/argus-pages.yml, package-lock.json]
permissions:
  contents: read
concurrency:
  group: argus-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: runtime
          persist-credentials: false
      - uses: ./runtime/.github/actions/argus-host-setup
      - name: Build the original WebUI with repository transport
        working-directory: runtime
        env:
          VITE_ARGUS_HOST: github
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm --prefix frontend/web ci
          npm --prefix frontend/web run build
          touch frontend/web/dist/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: runtime/frontend/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
