name: Install pinned repository host
description: Install the checked-out runtime without starting an agent
inputs:
  model:
    description: Install the default model CLI
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: runtime/pyproject.toml
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22.12.0'
        cache: npm
        cache-dependency-path: runtime/package-lock.json
    - shell: bash
      run: |
        python -m pip install -e ./runtime httpx
        npm --prefix runtime ci
        npm --prefix runtime run build
    - if: inputs.model == 'true'
      shell: bash
      run: npm install --global @openai/codex@0.169.0
